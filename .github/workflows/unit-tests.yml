name: Unit-Tests

on:
  pull_request:
  # Also run on pushes to the default branch so the badge / status reflects
  # post-merge state. Drop this if you want PR-only.
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    name: go test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          # Match go.mod; setup-go honours the toolchain directive.
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Verify modules
        run: go mod verify

      - name: Run unit tests
        # -race catches data races; -count=1 disables the test cache so a flaky
        # green run can't mask a genuine failure on a re-run.
        run: go test -race -count=1 ./...
